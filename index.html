<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎵 Local Music Player</title>
    <style>
        /* ── Reset & Base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0c0d0f;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            background-image: radial-gradient(ellipse at 20% 50%, #1a1d27 0%, #0c0d0f 70%);
        }

        /* ── App Container ── */
        .app {
            width: 100%;
            max-width: 1100px;
            height: 90vh;
            max-height: 800px;
            background: rgba(18, 21, 28, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ── Header ── */
        .header {
            padding: 22px 30px 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #f0b3ff, #6ec8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-icon {
            font-size: 26px;
            -webkit-text-fill-color: initial;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #c8d0e0;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            font-family: inherit;
            white-space: nowrap;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.18);
            color: #fff;
            transform: scale(1.02);
        }

        .btn-primary {
            background: rgba(100, 180, 255, 0.18);
            border-color: rgba(100, 180, 255, 0.25);
            color: #8ac4ff;
        }

        .btn-primary:hover {
            background: rgba(100, 180, 255, 0.28);
            border-color: rgba(100, 180, 255, 0.4);
            color: #b0d8ff;
        }

        .btn-icon {
            padding: 8px 12px;
            font-size: 16px;
        }

        .btn-danger {
            background: rgba(255, 80, 80, 0.12);
            border-color: rgba(255, 80, 80, 0.15);
            color: #ff7a7a;
        }
        .btn-danger:hover {
            background: rgba(255, 80, 80, 0.22);
            border-color: rgba(255, 80, 80, 0.3);
            color: #ff9a9a;
        }

        .file-input-hidden {
            display: none;
        }

        /* ── Main Layout ── */
        .main {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* ── Playlist Sidebar ── */
        .playlist {
            width: 280px;
            min-width: 200px;
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .playlist-header {
            padding: 16px 20px 12px 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #7a8499;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .playlist-header span {
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 11px;
            color: #9aa6b8;
        }

        .playlist-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px 12px 8px;
        }

        .playlist-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .playlist-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .playlist-scroll::-webkit-scrollbar-thumb {
            background: #2a2f3a;
            border-radius: 10px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 2px;
            position: relative;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .playlist-item.active {
            background: rgba(100, 180, 255, 0.12);
        }

        .playlist-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            height: 60%;
            width: 3px;
            background: #6ec8ff;
            border-radius: 0 4px 4px 0;
        }

        .playlist-item .index {
            font-size: 12px;
            color: #5a647a;
            width: 24px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .playlist-item .info {
            flex: 1;
            min-width: 0;
        }

        .playlist-item .title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e0e6f0;
        }

        .playlist-item .sub {
            font-size: 12px;
            color: #6a748a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item .duration {
            font-size: 12px;
            color: #5a647a;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .playlist-item .remove-btn {
            background: none;
            border: none;
            color: #4a5468;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            opacity: 0;
            transition: all 0.2s;
        }

        .playlist-item:hover .remove-btn {
            opacity: 1;
        }
        .playlist-item .remove-btn:hover {
            color: #ff6b6b;
        }

        .empty-playlist {
            padding: 40px 20px;
            text-align: center;
            color: #4a5468;
            font-size: 14px;
            line-height: 1.6;
        }

        .empty-playlist .big-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        /* ── Player Area ── */
        .player-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 30px 24px 30px;
            min-width: 0;
        }

        /* Now Playing */
        .now-playing {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .artwork {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, #1a1d27, #2a2f3a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .now-playing .track-info {
            flex: 1;
            min-width: 0;
        }

        .now-playing .track-title {
            font-size: 20px;
            font-weight: 600;
            color: #f0f4ff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing .track-artist {
            font-size: 14px;
            color: #7a8499;
            margin-top: 2px;
        }

        .now-playing .track-status {
            font-size: 13px;
            color: #4a5468;
        }

        /* Controls */
        .controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 16px 0 8px 0;
            min-height: 140px;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 4px 0;
        }

        .time {
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            color: #7a8499;
            min-width: 48px;
            font-weight: 500;
        }

        .progress-track {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transition: height 0.15s;
        }

        .progress-track:hover {
            height: 6px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6ec8ff, #a78bfa);
            border-radius: 10px;
            position: relative;
            transition: width 0.1s linear;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -4px;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .progress-track:hover .progress-fill::after {
            opacity: 1;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 0 4px 0;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #a8b2c8;
            font-size: 22px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 40px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.02);
        }

        .ctrl-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
            transform: scale(1.05);
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        .ctrl-btn.play-btn {
            width: 60px;
            height: 60px;
            font-size: 30px;
            background: rgba(100, 180, 255, 0.15);
            color: #8ac4ff;
            border: 1px solid rgba(100, 180, 255, 0.15);
        }

        .ctrl-btn.play-btn:hover {
            background: rgba(100, 180, 255, 0.25);
            color: #b0d8ff;
            border-color: rgba(100, 180, 255, 0.3);
        }

        .ctrl-btn.shuffle-active {
            color: #6ec8ff;
        }
        .ctrl-btn.repeat-active {
            color: #6ec8ff;
        }

        /* Volume */
        .volume-row {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-end;
            padding-top: 8px;
            flex-shrink: 0;
        }

        .volume-row .vol-icon {
            color: #5a647a;
            font-size: 18px;
        }

        .volume-track {
            width: 100px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
        }

        .volume-track:hover {
            height: 5px;
        }

        .volume-fill {
            height: 100%;
            width: 80%;
            background: #6a748a;
            border-radius: 10px;
            transition: width 0.1s;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .app {
                height: 100vh;
                max-height: none;
                border-radius: 0;
                padding: 0;
            }
            .main {
                flex-direction: column;
            }
            .playlist {
                width: 100%;
                height: 40%;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            }
            .player-area {
                height: 60%;
                padding: 16px 18px 18px 18px;
            }
            .header {
                padding: 14px 18px 12px 18px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .header-actions .btn span {
                display: none;
            }
            .now-playing .track-title {
                font-size: 17px;
            }
            .controls {
                min-height: 100px;
                padding: 8px 0 4px 0;
            }
            .ctrl-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
                padding: 4px 8px;
            }
            .ctrl-btn.play-btn {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
            .volume-track {
                width: 60px;
            }
            .playlist-item {
                padding: 6px 12px;
            }
            .artwork {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .header-actions .btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            .playlist-header {
                font-size: 11px;
                padding: 10px 14px 8px 14px;
            }
            .now-playing .track-title {
                font-size: 15px;
            }
            .now-playing .track-artist {
                font-size: 12px;
            }
            .time {
                font-size: 11px;
                min-width: 36px;
            }
            .player-area {
                padding: 12px 12px 14px 12px;
            }
            .volume-track {
                width: 40px;
            }
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(20, 24, 32, 0.94);
            backdrop-filter: blur(16px);
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #d0d8e8;
            font-size: 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            max-width: 90%;
            text-align: center;
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Loading shimmer ── */
        .shimmer {
            display: inline-block;
            background: linear-gradient(90deg, #1a1d27 25%, #2a2f3a 50%, #1a1d27 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        /* drag drop highlight */
        .playlist-item.dragover {
            background: rgba(100, 180, 255, 0.12);
            border: 1px dashed rgba(100, 180, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span class="logo"><span class="logo-icon">🎵</span> Local Player</span>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" id="btnSelectFolder">
                    <span>📂</span> <span>Select Folder</span>
                </button>
                <button class="btn" id="btnSelectFiles">
                    <span>🎵</span> <span>Add Files</span>
                </button>
                <button class="btn btn-danger btn-icon" id="btnClear" title="Clear playlist">
                    ✕
                </button>
                <input type="file" id="fileInput" class="file-input-hidden" webkitdirectory multiple accept="audio/*" />
                <input type="file" id="fileInputMultiple" class="file-input-hidden" multiple accept="audio/*" />
            </div>
        </header>

        <!-- Main -->
        <div class="main">
            <!-- Playlist -->
            <aside class="playlist">
                <div class="playlist-header">
                    Playlist
                    <span id="playlistCount">0</span>
                </div>
                <div class="playlist-scroll" id="playlistContainer">
                    <div class="empty-playlist" id="emptyState">
                        <span class="big-icon">🎧</span>
                        No music loaded<br />
                        <span style="font-size:13px;color:#3a4458;">Click "Select Folder" or "Add Files"</span>
                    </div>
                    <div id="playlistItems"></div>
                </div>
            </aside>

            <!-- Player -->
            <section class="player-area">
                <div class="now-playing">
                    <div class="artwork" id="artwork">🎵</div>
                    <div class="track-info">
                        <div class="track-title" id="currentTitle">No track selected</div>
                        <div class="track-artist" id="currentArtist">—</div>
                    </div>
                    <div class="track-status" id="trackStatus">⏸</div>
                </div>

                <div class="controls">
                    <!-- Progress -->
                    <div class="progress-container">
                        <span class="time" id="currentTime">0:00</span>
                        <div class="progress-track" id="progressTrack">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <span class="time" id="totalTime">0:00</span>
                    </div>

                    <!-- Buttons -->
                    <div class="control-buttons">
                        <button class="ctrl-btn" id="btnShuffle" title="Shuffle">🔀</button>
                        <button class="ctrl-btn" id="btnPrev" title="Previous">⏮</button>
                        <button class="ctrl-btn play-btn" id="btnPlay" title="Play / Pause">▶</button>
                        <button class="ctrl-btn" id="btnNext" title="Next">⏭</button>
                        <button class="ctrl-btn" id="btnRepeat" title="Repeat">🔁</button>
                    </div>

                    <!-- Volume -->
                    <div class="volume-row">
                        <span class="vol-icon">🔊</span>
                        <div class="volume-track" id="volumeTrack">
                            <div class="volume-fill" id="volumeFill"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ── DOM refs ──
            const playlistItemsEl = document.getElementById('playlistItems');
            const emptyState = document.getElementById('emptyState');
            const playlistCount = document.getElementById('playlistCount');

            const currentTitle = document.getElementById('currentTitle');
            const currentArtist = document.getElementById('currentArtist');
            const trackStatus = document.getElementById('trackStatus');
            const artwork = document.getElementById('artwork');

            const progressFill = document.getElementById('progressFill');
            const progressTrack = document.getElementById('progressTrack');
            const currentTimeEl = document.getElementById('currentTime');
            const totalTimeEl = document.getElementById('totalTime');

            const btnPlay = document.getElementById('btnPlay');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnShuffle = document.getElementById('btnShuffle');
            const btnRepeat = document.getElementById('btnRepeat');
            const btnClear = document.getElementById('btnClear');
            const btnSelectFolder = document.getElementById('btnSelectFolder');
            const btnSelectFiles = document.getElementById('btnSelectFiles');
            const fileInput = document.getElementById('fileInput');
            const fileInputMultiple = document.getElementById('fileInputMultiple');
            const volumeTrack = document.getElementById('volumeTrack');
            const volumeFill = document.getElementById('volumeFill');

            const toastEl = document.getElementById('toast');

            // ── State ──
            let playlist = []; // Array of { file, name, path, duration? }
            let currentIndex = -1;
            let isPlaying = false;
            let isShuffled = false;
            let repeatMode = 'none'; // 'none' | 'all' | 'one'
            let volume = 0.8;
            let audio = new Audio();
            let isDragging = false;

            // ── Helpers ──
            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            function getFileName(path) {
                return path.split(/[\\/]/).pop() || 'Unknown';
            }

            function getDisplayName(file) {
                const name = file.name || getFileName(file.path || file.webkitRelativePath || '');
                // remove extension
                return name.replace(/\.[^.]+$/, '');
            }

            function getFileExtension(file) {
                const name = file.name || file.path || '';
                const ext = name.split('.').pop()?.toLowerCase() || '';
                return ext;
            }

            function isAudioFile(file) {
                const ext = getFileExtension(file);
                return ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'alac', 'opus'].includes(ext);
            }

            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            // ── Toast ──
            let toastTimeout = null;

            function showToast(msg, duration = 2500) {
                toastEl.textContent = msg;
                toastEl.classList.add('visible');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toastEl.classList.remove('visible');
                }, duration);
            }

            // ── Playlist rendering ──
            function renderPlaylist() {
                const hasItems = playlist.length > 0;
                emptyState.style.display = hasItems ? 'none' : 'block';
                playlistCount.textContent = playlist.length;

                if (!hasItems) {
                    playlistItemsEl.innerHTML = '';
                    currentTitle.textContent = 'No track selected';
                    currentArtist.textContent = '—';
                    artwork.textContent = '🎵';
                    trackStatus.textContent = '⏸';
                    btnPlay.textContent = '▶';
                    isPlaying = false;
                    audio.pause();
                    audio.src = '';
                    progressFill.style.width = '0%';
                    currentTimeEl.textContent = '0:00';
                    totalTimeEl.textContent = '0:00';
                    return;
                }

                let html = '';
                playlist.forEach((item, idx) => {
                    const isActive = idx === currentIndex;
                    const name = item.displayName || getDisplayName(item.file);
                    const dur = item.duration ? formatTime(item.duration) : '--:--';
                    html += `
                        <div class="playlist-item ${isActive ? 'active' : ''}" data-index="${idx}">
                            <span class="index">${idx + 1}</span>
                            <div class="info">
                                <div class="title">${escapeHtml(name)}</div>
                                <div class="sub">${item.path ? escapeHtml(item.path) : 'Local file'}</div>
                            </div>
                            <span class="duration">${dur}</span>
                            <button class="remove-btn" data-index="${idx}" title="Remove">✕</button>
                        </div>
                    `;
                });
                playlistItemsEl.innerHTML = html;

                // Update now playing
                if (currentIndex >= 0 && currentIndex < playlist.length) {
                    const cur = playlist[currentIndex];
                    const name = cur.displayName || getDisplayName(cur.file);
                    currentTitle.textContent = name;
                    currentArtist.textContent = cur.path || 'Local file';
                    artwork.textContent = '🎵';
                    // Try to set artwork from file metadata? not easily possible without libraries
                }

                // Update active state
                document.querySelectorAll('.playlist-item').forEach(el => {
                    const idx = parseInt(el.dataset.index);
                    el.classList.toggle('active', idx === currentIndex);
                });
            }

            // simple escape
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ── Audio loading & playing ──
            function loadTrack(index) {
                if (index < 0 || index >= playlist.length) {
                    audio.pause();
                    audio.src = '';
                    isPlaying = false;
                    btnPlay.textContent = '▶';
                    trackStatus.textContent = '⏸';
                    return;
                }

                currentIndex = index;
                const item = playlist[index];
                const file = item.file;

                if (!file) {
                    showToast('Error: file not found', 2000);
                    return;
                }

                const url = URL.createObjectURL(file);
                audio.src = url;
                audio.load();

                // Update UI
                const name = item.displayName || getDisplayName(file);
                currentTitle.textContent = name;
                currentArtist.textContent = item.path || 'Local file';
                artwork.textContent = '🎵';
                renderPlaylist();

                // Auto-play if was playing
                if (isPlaying) {
                    audio.play().catch(() => {
                        isPlaying = false;
                        btnPlay.textContent = '▶';
                        trackStatus.textContent = '⏸';
                    });
                } else {
                    trackStatus.textContent = '⏸';
                    btnPlay.textContent = '▶';
                }

                // Get duration once loaded
                audio.onloadedmetadata = () => {
                    if (audio.duration && isFinite(audio.duration)) {
                        item.duration = audio.duration;
                        totalTimeEl.textContent = formatTime(audio.duration);
                        renderPlaylist();
                    }
                };

                // Time update
                audio.ontimeupdate = () => {
                    if (audio.duration && isFinite(audio.duration)) {
                        const pct = (audio.currentTime / audio.duration) * 100;
                        progressFill.style.width = `${Math.min(pct, 100)}%`;
                        currentTimeEl.textContent = formatTime(audio.currentTime);
                        totalTimeEl.textContent = formatTime(audio.duration);
                    }
                };

                // Ended
                audio.onended = () => {
                    if (repeatMode === 'one') {
                        audio.currentTime = 0;
                        audio.play().catch(() => {});
                        return;
                    }
                    if (repeatMode === 'all' || isShuffled) {
                        nextTrack();
                    } else {
                        // go to next if available, else pause
                        if (currentIndex < playlist.length - 1) {
                            nextTrack();
                        } else {
                            isPlaying = false;
                            btnPlay.textContent = '▶';
                            trackStatus.textContent = '⏸';
                            progressFill.style.width = '100%';
                            currentTimeEl.textContent = formatTime(audio.duration || 0);
                        }
                    }
                };

                // Error
                audio.onerror = () => {
                    showToast(`Error playing: ${name}`, 2500);
                    isPlaying = false;
                    btnPlay.textContent = '▶';
                    trackStatus.textContent = '⚠';
                };
            }

            function playPause() {
                if (playlist.length === 0) {
                    showToast('No tracks in playlist', 1500);
                    return;
                }

                if (currentIndex === -1) {
                    currentIndex = 0;
                    loadTrack(0);
                    isPlaying = true;
                    audio.play().catch(() => {});
                    btnPlay.textContent = '⏸';
                    trackStatus.textContent = '▶';
                    return;
                }

                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    btnPlay.textContent = '▶';
                    trackStatus.textContent = '⏸';
                } else {
                    audio.play().catch(() => {
                        // if play fails, reload
                        if (audio.src) {
                            audio.load();
                            audio.play().catch(() => {});
                        } else {
                            loadTrack(currentIndex);
                        }
                    });
                    isPlaying = true;
                    btnPlay.textContent = '⏸';
                    trackStatus.textContent = '▶';
                }
            }

            function nextTrack() {
                if (playlist.length === 0) return;
                let nextIdx;
                if (isShuffled) {
                    const shuffled = shuffleArray([...Array(playlist.length).keys()]);
                    const curPos = shuffled.indexOf(currentIndex);
                    nextIdx = shuffled[(curPos + 1) % shuffled.length];
                } else {
                    nextIdx = (currentIndex + 1) % playlist.length;
                }
                loadTrack(nextIdx);
                if (isPlaying) {
                    audio.play().catch(() => {});
                }
            }

            function prevTrack() {
                if (playlist.length === 0) return;
                if (audio.currentTime > 3) {
                    audio.currentTime = 0;
                    return;
                }
                let prevIdx;
                if (isShuffled) {
                    const shuffled = shuffleArray([...Array(playlist.length).keys()]);
                    const curPos = shuffled.indexOf(currentIndex);
                    prevIdx = shuffled[(curPos - 1 + shuffled.length) % shuffled.length];
                } else {
                    prevIdx = (currentIndex - 1 + playlist.length) % playlist.length;
                }
                loadTrack(prevIdx);
                if (isPlaying) {
                    audio.play().catch(() => {});
                }
            }

            // ── Add files ──
            function addFiles(fileList) {
                let added = 0;
                for (const file of fileList) {
                    if (isAudioFile(file)) {
                        const path = file.webkitRelativePath || file.path || file.name;
                        const displayName = getDisplayName(file);
                        // Avoid duplicates (by name + size)
                        const exists = playlist.some(item =>
                            item.file.name === file.name &&
                            item.file.size === file.size
                        );
                        if (!exists) {
                            playlist.push({
                                file: file,
                                path: path,
                                displayName: displayName,
                                duration: null,
                            });
                            added++;
                        }
                    }
                }

                if (added === 0) {
                    showToast('No audio files found', 1500);
                    return;
                }

                showToast(`Added ${added} track${added > 1 ? 's' : ''}`, 1800);

                // If playlist was empty, auto-load first
                if (playlist.length > 0 && currentIndex === -1) {
                    currentIndex = 0;
                    loadTrack(0);
                    isPlaying = false;
                    btnPlay.textContent = '▶';
                    trackStatus.textContent = '⏸';
                } else {
                    renderPlaylist();
                    // if current track is loaded, update duration display
                    if (currentIndex >= 0 && currentIndex < playlist.length) {
                        const cur = playlist[currentIndex];
                        if (cur.duration) {
                            totalTimeEl.textContent = formatTime(cur.duration);
                        }
                    }
                }
                renderPlaylist();
            }

            // ── Clear ──
            function clearPlaylist() {
                if (playlist.length === 0) return;
                audio.pause();
                audio.src = '';
                isPlaying = false;
                btnPlay.textContent = '▶';
                trackStatus.textContent = '⏸';
                playlist = [];
                currentIndex = -1;
                renderPlaylist();
                showToast('Playlist cleared', 1200);
            }

            // ── Volume ──
            function setVolume(val) {
                volume = Math.max(0, Math.min(1, val));
                audio.volume = volume;
                volumeFill.style.width = `${volume * 100}%`;
            }

            // ── Event listeners ──

            // Play / Pause
            btnPlay.addEventListener('click', playPause);

            // Next / Prev
            btnNext.addEventListener('click', nextTrack);
            btnPrev.addEventListener('click', prevTrack);

            // Shuffle
            btnShuffle.addEventListener('click', () => {
                isShuffled = !isShuffled;
                btnShuffle.classList.toggle('shuffle-active', isShuffled);
                showToast(isShuffled ? 'Shuffle ON' : 'Shuffle OFF', 1000);
            });

            // Repeat
            btnRepeat.addEventListener('click', () => {
                const modes = ['none', 'all', 'one'];
                const idx = (modes.indexOf(repeatMode) + 1) % modes.length;
                repeatMode = modes[idx];
                btnRepeat.classList.toggle('repeat-active', repeatMode !== 'none');
                const labels = { none: 'Repeat OFF', all: 'Repeat ALL', one: 'Repeat ONE' };
                showToast(labels[repeatMode], 1000);
            });

            // Volume
            volumeTrack.addEventListener('click', (e) => {
                const rect = volumeTrack.getBoundingClientRect();
                const pct = (e.clientX - rect.left) / rect.width;
                setVolume(pct);
            });

            volumeTrack.addEventListener('mousedown', (e) => {
                isDragging = true;
                const rect = volumeTrack.getBoundingClientRect();
                const pct = (e.clientX - rect.left) / rect.width;
                setVolume(pct);
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const rect = volumeTrack.getBoundingClientRect();
                    const pct = (e.clientX - rect.left) / rect.width;
                    setVolume(Math.max(0, Math.min(1, pct)));
                }
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // Progress seeking
            progressTrack.addEventListener('click', (e) => {
                if (!audio.duration || !isFinite(audio.duration)) return;
                const rect = progressTrack.getBoundingClientRect();
                const pct = (e.clientX - rect.left) / rect.width;
                audio.currentTime = pct * audio.duration;
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    playPause();
                }
                if (e.code === 'ArrowRight') {
                    e.preventDefault();
                    if (audio.duration) audio.currentTime = Math.min(audio.currentTime + 5, audio.duration);
                }
                if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    if (audio.duration) audio.currentTime = Math.max(audio.currentTime - 5, 0);
                }
                if (e.code === 'KeyN') nextTrack();
                if (e.code === 'KeyP') prevTrack();
            });

            // ── File selection ──

            // Folder
            btnSelectFolder.addEventListener('click', () => {
                // Try File System Access API first
                if ('showDirectoryPicker' in window) {
                    window.showDirectoryPicker()
                        .then(async (dirHandle) => {
                            const files = [];
                            await walkDirectory(dirHandle, files);
                            if (files.length > 0) {
                                addFiles(files);
                            } else {
                                showToast('No audio files found in folder', 1500);
                            }
                        })
                        .catch((err) => {
                            if (err.name !== 'AbortError' && err.name !== 'SecurityError') {
                                // Fallback to input
                                fileInput.click();
                            } else if (err.name === 'SecurityError') {
                                showToast('Permission denied. Use "Add Files" instead.', 2000);
                            }
                        });
                } else {
                    fileInput.click();
                }
            });

            async function walkDirectory(dirHandle, files, path = '') {
                for await (const entry of dirHandle.values()) {
                    if (entry.kind === 'file') {
                        const file = await entry.getFile();
                        if (isAudioFile(file)) {
                            file.path = path + entry.name;
                            files.push(file);
                        }
                    } else if (entry.kind === 'directory') {
                        await walkDirectory(entry, files, path + entry.name + '/');
                    }
                }
            }

            fileInput.addEventListener('change', (e) => {
                const files = e.target.files;
                if (files.length > 0) {
                    addFiles(files);
                }
                fileInput.value = '';
            });

            // Add Files (multiple)
            btnSelectFiles.addEventListener('click', () => {
                fileInputMultiple.click();
            });

            fileInputMultiple.addEventListener('change', (e) => {
                const files = e.target.files;
                if (files.length > 0) {
                    addFiles(files);
                }
                fileInputMultiple.value = '';
            });

            // Clear
            btnClear.addEventListener('click', clearPlaylist);

            // Click on playlist item
            playlistItemsEl.addEventListener('click', (e) => {
                const item = e.target.closest('.playlist-item');
                if (!item) return;
                const idx = parseInt(item.dataset.index);
                if (isNaN(idx)) return;
                // Check if remove button clicked
                if (e.target.classList.contains('remove-btn')) {
                    const idx2 = parseInt(e.target.dataset.index);
                    if (!isNaN(idx2)) {
                        playlist.splice(idx2, 1);
                        if (currentIndex === idx2) {
                            audio.pause();
                            audio.src = '';
                            isPlaying = false;
                            btnPlay.textContent = '▶';
                            trackStatus.textContent = '⏸';
                            currentIndex = -1;
                        } else if (currentIndex > idx2) {
                            currentIndex--;
                        }
                        renderPlaylist();
                        if (playlist.length === 0) {
                            currentTitle.textContent = 'No track selected';
                            currentArtist.textContent = '—';
                            artwork.textContent = '🎵';
                            trackStatus.textContent = '⏸';
                            progressFill.style.width = '0%';
                            currentTimeEl.textContent = '0:00';
                            totalTimeEl.textContent = '0:00';
                        } else if (currentIndex === -1 && playlist.length > 0) {
                            currentIndex = 0;
                            loadTrack(0);
                        }
                        return;
                    }
                }
                // Load track
                if (idx >= 0 && idx < playlist.length) {
                    const wasPlaying = isPlaying;
                    loadTrack(idx);
                    if (wasPlaying) {
                        audio.play().catch(() => {});
                        isPlaying = true;
                        btnPlay.textContent = '⏸';
                        trackStatus.textContent = '▶';
                    } else {
                        isPlaying = false;
                        btnPlay.textContent = '▶';
                        trackStatus.textContent = '⏸';
                    }
                }
            });

            // ── Drag and drop on app ──
            const app = document.getElementById('app');

            app.addEventListener('dragover', (e) => {
                e.preventDefault();
                app.style.borderColor = 'rgba(100,180,255,0.3)';
            });

            app.addEventListener('dragleave', () => {
                app.style.borderColor = 'transparent';
            });

            app.addEventListener('drop', (e) => {
                e.preventDefault();
                app.style.borderColor = 'transparent';
                const items = e.dataTransfer.items;
                if (!items) return;
                const files = [];
                for (const item of items) {
                    if (item.kind === 'file') {
                        const file = item.getAsFile();
                        if (file && isAudioFile(file)) {
                            files.push(file);
                        }
                    }
                }
                if (files.length > 0) {
                    addFiles(files);
                } else {
                    showToast('No audio files dropped', 1500);
                }
            });

            // ── Init ──
            setVolume(0.8);

            // Pre-load some example? No, empty state.

            // expose for debugging
            window.__player = { playlist, audio, playPause, nextTrack, prevTrack, loadTrack };

            console.log('🎵 Local Music Player ready!');
            console.log('📂 Click "Select Folder" or "Add Files" to load your music.');

        })();
    </script>

</body>
</html>
