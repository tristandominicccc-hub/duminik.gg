<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmony · Local Music Player</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ─────────────── Reset & Base ─────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0b0d11;
            --bg-surface: #14181f;
            --bg-elevated: #1c212b;
            --bg-hover: #282f3d;
            --text-primary: #f0f4fe;
            --text-secondary: #9aa8c0;
            --text-muted: #5a6a82;
            --accent: #6ec8ff;
            --accent-glow: rgba(110, 200, 255, 0.25);
            --accent-purple: #a78bfa;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --radius-lg: 24px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(ellipse at 30% 20%, #1a1f2e 0%, #0b0d11 70%);
            margin: 0;
        }

        /* ─────────────── Scrollbar ─────────────── */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3342;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3d4a5e;
        }

        /* ─────────────── App Container ─────────────── */
        .app {
            width: 100%;
            max-width: 1200px;
            height: 92vh;
            max-height: 820px;
            background: var(--bg-surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ─────────────── Header ─────────────── */
        .header {
            padding: 18px 28px 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-subtle);
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            font-size: 26px;
            color: var(--accent);
            filter: drop-shadow(0 0 12px var(--accent-glow));
        }

        .logo span {
            background: linear-gradient(135deg, var(--accent), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            white-space: nowrap;
            backdrop-filter: blur(4px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.14);
            color: #fff;
            transform: translateY(-1px);
        }
        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: rgba(110, 200, 255, 0.12);
            border-color: rgba(110, 200, 255, 0.18);
            color: var(--accent);
        }
        .btn-primary:hover {
            background: rgba(110, 200, 255, 0.22);
            border-color: rgba(110, 200, 255, 0.3);
            color: #b0d8ff;
        }

        .btn-danger {
            background: rgba(255, 80, 80, 0.08);
            border-color: rgba(255, 80, 80, 0.12);
            color: #ff7a7a;
        }
        .btn-danger:hover {
            background: rgba(255, 80, 80, 0.18);
            border-color: rgba(255, 80, 80, 0.25);
            color: #ff9a9a;
        }

        .btn-icon {
            padding: 8px 12px;
            font-size: 15px;
        }

        .file-input-hidden {
            display: none;
        }

        /* ─────────────── Main Layout ─────────────── */
        .main {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* ─────────────── Playlist Sidebar ─────────────── */
        .playlist {
            width: 300px;
            min-width: 200px;
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .playlist-header {
            padding: 16px 20px 12px 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .playlist-header .count {
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .playlist-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px 12px 8px;
        }

        /* ── Playlist Item ── */
        .playlist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            margin-bottom: 2px;
            position: relative;
            user-select: none;
        }

        .playlist-item:hover {
            background: var(--bg-hover);
        }
        .playlist-item.active {
            background: rgba(110, 200, 255, 0.08);
        }
        .playlist-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 18%;
            height: 64%;
            width: 3px;
            background: linear-gradient(to bottom, var(--accent), var(--accent-purple));
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .playlist-item .index {
            font-size: 12px;
            color: var(--text-muted);
            width: 24px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .playlist-item .info {
            flex: 1;
            min-width: 0;
        }
        .playlist-item .title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }
        .playlist-item .sub {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        .playlist-item .duration {
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .playlist-item .remove-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 4px 6px;
            border-radius: 6px;
            opacity: 0;
            transition: all var(--transition);
        }
        .playlist-item:hover .remove-btn {
            opacity: 1;
        }
        .playlist-item .remove-btn:hover {
            color: #ff6b6b;
            background: rgba(255, 80, 80, 0.1);
        }

        .playlist-item .drag-handle {
            color: var(--text-muted);
            font-size: 14px;
            cursor: grab;
            opacity: 0.3;
            transition: opacity var(--transition);
        }
        .playlist-item:hover .drag-handle {
            opacity: 0.7;
        }
        .playlist-item .drag-handle:active {
            cursor: grabbing;
        }

        .playlist-item.dragging {
            opacity: 0.4;
            background: var(--bg-hover);
        }
        .playlist-item.drag-over {
            border: 1px dashed rgba(110, 200, 255, 0.3);
            background: rgba(110, 200, 255, 0.04);
        }

        /* ── Empty State ── */
        .empty-playlist {
            padding: 48px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.7;
        }
        .empty-playlist .big-icon {
            font-size: 52px;
            color: var(--text-muted);
            opacity: 0.25;
            display: block;
            margin-bottom: 14px;
        }
        .empty-playlist .hint {
            font-size: 13px;
            color: #3a4a5e;
        }

        /* ─────────────── Player Area ─────────────── */
        .player-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 22px 32px 26px 32px;
            min-width: 0;
            background: rgba(0, 0, 0, 0.08);
        }

        /* ── Now Playing ── */
        .now-playing {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .artwork {
            width: 72px;
            height: 72px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #1c212b, #2a3342);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: var(--text-secondary);
            flex-shrink: 0;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-subtle);
            transition: all var(--transition);
        }
        .artwork.has-track {
            background: linear-gradient(135deg, #1e2a3a, #2a3342);
            box-shadow: 0 6px 30px rgba(110, 200, 255, 0.08);
        }

        .now-playing .track-info {
            flex: 1;
            min-width: 0;
        }
        .now-playing .track-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.2px;
        }
        .now-playing .track-artist {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing .track-status {
            font-size: 14px;
            color: var(--text-muted);
            flex-shrink: 0;
            padding: 4px 10px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            min-width: 48px;
            text-align: center;
        }
        .now-playing .track-status.playing {
            color: var(--accent);
            border-color: rgba(110, 200, 255, 0.15);
        }

        /* ── Controls ── */
        .controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 12px 0 6px 0;
            min-height: 130px;
        }

        /* progress */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 4px 0;
        }
        .time {
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
            min-width: 48px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .progress-track {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transition: height 0.15s;
        }
        .progress-track:hover {
            height: 7px;
        }
        .progress-track .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-purple));
            border-radius: 10px;
            position: relative;
            transition: width 0.08s linear;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .progress-track .progress-fill::after {
            content: '';
            position: absolute;
            right: -5px;
            top: -4px;
            width: 13px;
            height: 13px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        }
        .progress-track:hover .progress-fill::after {
            opacity: 1;
        }

        /* control buttons */
        .control-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 0 6px 0;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 40px;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.02);
        }
        .ctrl-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.04);
        }
        .ctrl-btn:active {
            transform: scale(0.92);
        }

        .ctrl-btn.play-btn {
            width: 58px;
            height: 58px;
            font-size: 28px;
            background: rgba(110, 200, 255, 0.1);
            color: var(--accent);
            border: 1px solid rgba(110, 200, 255, 0.12);
            box-shadow: 0 0 30px rgba(110, 200, 255, 0.04);
        }
        .ctrl-btn.play-btn:hover {
            background: rgba(110, 200, 255, 0.2);
            border-color: rgba(110, 200, 255, 0.25);
            color: #b0d8ff;
            box-shadow: 0 0 40px rgba(110, 200, 255, 0.08);
        }

        .ctrl-btn.active-mode {
            color: var(--accent);
        }
        .ctrl-btn.active-mode i {
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        /* volume */
        .volume-row {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-end;
            padding-top: 10px;
            flex-shrink: 0;
        }
        .volume-row .vol-icon {
            color: var(--text-muted);
            font-size: 16px;
            width: 20px;
            text-align: center;
            cursor: pointer;
            transition: color var(--transition);
        }
        .volume-row .vol-icon:hover {
            color: var(--text-secondary);
        }

        .volume-track {
            width: 110px;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transition: height 0.15s;
        }
        .volume-track:hover {
            height: 6px;
        }
        .volume-track .volume-fill {
            height: 100%;
            width: 80%;
            background: var(--text-secondary);
            border-radius: 10px;
            transition: width 0.08s;
        }
        .volume-track:hover .volume-fill {
            background: var(--accent);
        }

        /* ─────────────── Toast ─────────────── */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(18, 24, 34, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.7);
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            max-width: 90%;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast i {
            color: var(--accent);
            font-size: 16px;
        }
        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ─────────────── Responsive ─────────────── */
        @media (max-width: 820px) {
            .app {
                height: 100vh;
                max-height: none;
                border-radius: 0;
                padding: 0;
            }
            .main {
                flex-direction: column;
            }
            .playlist {
                width: 100%;
                height: 38%;
                border-right: none;
                border-bottom: 1px solid var(--border-subtle);
            }
            .player-area {
                height: 62%;
                padding: 16px 18px 18px 18px;
            }
            .header {
                padding: 12px 16px 10px 16px;
                gap: 6px;
            }
            .header-actions .btn span {
                display: none;
            }
            .header-actions .btn {
                padding: 8px 12px;
            }
            .now-playing .track-title {
                font-size: 18px;
            }
            .controls {
                min-height: 100px;
                padding: 6px 0 2px 0;
            }
            .ctrl-btn {
                width: 38px;
                height: 38px;
                font-size: 17px;
                padding: 4px 8px;
            }
            .ctrl-btn.play-btn {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
            .volume-track {
                width: 70px;
            }
            .playlist-item {
                padding: 6px 12px 6px 10px;
            }
            .artwork {
                width: 54px;
                height: 54px;
                font-size: 26px;
            }
            .logo {
                font-size: 17px;
            }
            .logo i {
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {
            .header-actions .btn {
                padding: 6px 10px;
                font-size: 12px;
            }
            .playlist-header {
                font-size: 11px;
                padding: 10px 14px 8px 14px;
            }
            .now-playing .track-title {
                font-size: 16px;
            }
            .now-playing .track-artist {
                font-size: 12px;
            }
            .time {
                font-size: 11px;
                min-width: 36px;
            }
            .player-area {
                padding: 12px 12px 14px 12px;
            }
            .volume-track {
                width: 50px;
            }
            .control-buttons {
                gap: 2px;
            }
            .ctrl-btn {
                width: 34px;
                height: 34px;
                font-size: 15px;
            }
            .ctrl-btn.play-btn {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }
            .playlist-item .sub {
                font-size: 11px;
            }
            .playlist-item .title {
                font-size: 13px;
            }
            .artwork {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }
        }

        /* ─────────────── Drag & Drop Glow ─────────────── */
        .app.drag-over {
            border-color: rgba(110, 200, 255, 0.25);
            box-shadow: 0 0 60px rgba(110, 200, 255, 0.04);
        }
        .app.drag-over .main {
            background: rgba(110, 200, 255, 0.01);
        }

        /* ─────────────── Shimmer / loading ─────────────── */
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        .shimmer {
            background: linear-gradient(90deg, #1a1f2a 25%, #2a3342 50%, #1a1f2a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- ─── Header ─── -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <i class="fas fa-headphones-simple"></i>
                    <span>Harmony</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" id="btnSelectFolder">
                    <i class="fas fa-folder-open"></i> <span>Folder</span>
                </button>
                <button class="btn" id="btnSelectFiles">
                    <i class="fas fa-plus"></i> <span>Files</span>
                </button>
                <button class="btn btn-danger btn-icon" id="btnClear" title="Clear playlist">
                    <i class="fas fa-trash-can"></i>
                </button>
                <input type="file" id="fileInput" class="file-input-hidden" webkitdirectory multiple accept="audio/*" />
                <input type="file" id="fileInputMultiple" class="file-input-hidden" multiple accept="audio/*" />
            </div>
        </header>

        <!-- ─── Main ─── -->
        <div class="main">
            <!-- Playlist -->
            <aside class="playlist">
                <div class="playlist-header">
                    <span><i class="fas fa-list-ul" style="margin-right:8px;font-size:12px;"></i> Playlist</span>
                    <span class="count" id="playlistCount">0</span>
                </div>
                <div class="playlist-scroll" id="playlistContainer">
                    <div class="empty-playlist" id="emptyState">
                        <i class="fas fa-music big-icon"></i>
                        <div>No music loaded</div>
                        <div class="hint"><i class="fas fa-folder-open"></i> Click "Folder" or "Files" to add tracks</div>
                    </div>
                    <div id="playlistItems"></div>
                </div>
            </aside>

            <!-- Player -->
            <section class="player-area">
                <div class="now-playing">
                    <div class="artwork" id="artwork">
                        <i class="fas fa-music"></i>
                    </div>
                    <div class="track-info">
                        <div class="track-title" id="currentTitle">No track selected</div>
                        <div class="track-artist" id="currentArtist">—</div>
                    </div>
                    <div class="track-status" id="trackStatus">
                        <i class="fas fa-pause"></i>
                    </div>
                </div>

                <div class="controls">
                    <!-- Progress -->
                    <div class="progress-container">
                        <span class="time" id="currentTime">0:00</span>
                        <div class="progress-track" id="progressTrack">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <span class="time" id="totalTime">0:00</span>
                    </div>

                    <!-- Buttons -->
                    <div class="control-buttons">
                        <button class="ctrl-btn" id="btnShuffle" title="Shuffle">
                            <i class="fas fa-shuffle"></i>
                        </button>
                        <button class="ctrl-btn" id="btnPrev" title="Previous">
                            <i class="fas fa-backward-step"></i>
                        </button>
                        <button class="ctrl-btn play-btn" id="btnPlay" title="Play / Pause">
                            <i class="fas fa-play"></i>
                        </button>
                        <button class="ctrl-btn" id="btnNext" title="Next">
                            <i class="fas fa-forward-step"></i>
                        </button>
                        <button class="ctrl-btn" id="btnRepeat" title="Repeat">
                            <i class="fas fa-repeat"></i>
                        </button>
                    </div>

                    <!-- Volume -->
                    <div class="volume-row">
                        <span class="vol-icon" id="btnMute" title="Mute / Unmute">
                            <i class="fas fa-volume-high"></i>
                        </span>
                        <div class="volume-track" id="volumeTrack">
                            <div class="volume-fill" id="volumeFill"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- ─── Toast ─── -->
    <div class="toast" id="toast">
        <i class="fas fa-circle-check"></i>
        <span id="toastMessage">Ready</span>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ──────────────────────────────────
            const playlistItemsEl = document.getElementById('playlistItems');
            const emptyState = document.getElementById('emptyState');
            const playlistCount = document.getElementById('playlistCount');

            const currentTitle = document.getElementById('currentTitle');
            const currentArtist = document.getElementById('currentArtist');
            const trackStatus = document.getElementById('trackStatus');
            const artwork = document.getElementById('artwork');

            const progressFill = document.getElementById('progressFill');
            const progressTrack = document.getElementById('progressTrack');
            const currentTimeEl = document.getElementById('currentTime');
            const totalTimeEl = document.getElementById('totalTime');

            const btnPlay = document.getElementById('btnPlay');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnShuffle = document.getElementById('btnShuffle');
            const btnRepeat = document.getElementById('btnRepeat');
            const btnClear = document.getElementById('btnClear');
            const btnSelectFolder = document.getElementById('btnSelectFolder');
            const btnSelectFiles = document.getElementById('btnSelectFiles');
            const fileInput = document.getElementById('fileInput');
            const fileInputMultiple = document.getElementById('fileInputMultiple');
            const volumeTrack = document.getElementById('volumeTrack');
            const volumeFill = document.getElementById('volumeFill');
            const btnMute = document.getElementById('btnMute');
            const toastEl = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const app = document.getElementById('app');

            // ─── State ──────────────────────────────────────
            let playlist = [];
            let currentIndex = -1;
            let isPlaying = false;
            let isShuffled = false;
            let repeatMode = 'none'; // 'none' | 'all' | 'one'
            let volume = 0.80;
            let previousVolume = 0.80;
            let isMuted = false;
            const audio = new Audio();
            let isDraggingVolume = false;
            let isDraggingProgress = false;
            let dragStartIndex = null;

            // ─── Helpers ──────────────────────────────────
            function formatTime(seconds) {
                if (!seconds || isNaN(seconds) || !isFinite(seconds)) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            function getDisplayName(file) {
                const name = file.name || file.path || 'Unknown';
                return name.replace(/\.[^.]+$/, '');
            }

            function getFileExtension(file) {
                const name = file.name || file.path || '';
                const ext = name.split('.').pop()?.toLowerCase() || '';
                return ext;
            }

            function isAudioFile(file) {
                const ext = getFileExtension(file);
                return ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'alac', 'opus', 'webm', 'weba'].includes(
                ext);
            }

            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function getShuffledOrder() {
                const indices = Array.from({ length: playlist.length }, (_, i) => i);
                return shuffleArray(indices);
            }

            function getNextIndex(fromIndex) {
                if (playlist.length === 0) return -1;
                if (isShuffled) {
                    const order = getShuffledOrder();
                    const pos = order.indexOf(fromIndex);
                    return order[(pos + 1) % order.length];
                } else {
                    return (fromIndex + 1) % playlist.length;
                }
            }

            function getPrevIndex(fromIndex) {
                if (playlist.length === 0) return -1;
                if (isShuffled) {
                    const order = getShuffledOrder();
                    const pos = order.indexOf(fromIndex);
                    return order[(pos - 1 + order.length) % order.length];
                } else {
                    return (fromIndex - 1 + playlist.length) % playlist.length;
                }
            }

            // ─── Toast ──────────────────────────────────────
            let toastTimeout = null;

            function showToast(msg, icon = 'fa-circle-check', duration = 2400) {
                toastMessage.textContent = msg;
                const iconEl = toastEl.querySelector('i');
                iconEl.className = `fas ${icon}`;
                toastEl.classList.add('visible');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toastEl.classList.remove('visible');
                }, duration);
            }

            // ─── Render Playlist ──────────────────────────
            function renderPlaylist() {
                const hasItems = playlist.length > 0;
                emptyState.style.display = hasItems ? 'none' : 'block';
                playlistCount.textContent = playlist.length;

                if (!hasItems) {
                    playlistItemsEl.innerHTML = '';
                    currentTitle.textContent = 'No track selected';
                    currentArtist.textContent = '—';
                    artwork.className = 'artwork';
                    artwork.innerHTML = '<i class="fas fa-music"></i>';
                    trackStatus.innerHTML = '<i class="fas fa-pause"></i>';
                    trackStatus.className = 'track-status';
                    btnPlay.innerHTML = '<i class="fas fa-play"></i>';
                    isPlaying = false;
                    audio.pause();
                    audio.src = '';
                    progressFill.style.width = '0%';
                    currentTimeEl.textContent = '0:00';
                    totalTimeEl.textContent = '0:00';
                    return;
                }

                let html = '';
                playlist.forEach((item, idx) => {
                    const isActive = idx === currentIndex;
                    const name = item.displayName || getDisplayName(item.file);
                    const dur = item.duration ? formatTime(item.duration) : '--:--';
                    const pathDisplay = item.path || 'Local file';
                    html += `
                        <div class="playlist-item ${isActive ? 'active' : ''}" data-index="${idx}" draggable="true">
                            <span class="index">${idx + 1}</span>
                            <span class="drag-handle"><i class="fas fa-grip-lines"></i></span>
                            <div class="info">
                                <div class="title">${escapeHtml(name)}</div>
                                <div class="sub">${escapeHtml(pathDisplay)}</div>
                            </div>
                            <span class="duration">${dur}</span>
                            <button class="remove-btn" data-index="${idx}" title="Remove"><i class="fas fa-xmark"></i></button>
                        </div>
                    `;
                });
                playlistItemsEl.innerHTML = html;

                // Update now playing
                if (currentIndex >= 0 && currentIndex < playlist.length) {
                    const cur = playlist[currentIndex];
                    const name = cur.displayName || getDisplayName(cur.file);
                    currentTitle.textContent = name;
                    currentArtist.textContent = cur.path || 'Local file';
                    artwork.className = 'artwork has-track';
                    artwork.innerHTML = `<i class="fas fa-music"></i>`;
                }

                // Update active state
                document.querySelectorAll('.playlist-item').forEach(el => {
                    const idx = parseInt(el.dataset.index);
                    el.classList.toggle('active', idx === currentIndex);
                });

                // Update duration display for current
                if (currentIndex >= 0 && currentIndex < playlist.length) {
                    const cur = playlist[currentIndex];
                    if (cur.duration) {
                        totalTimeEl.textContent = formatTime(cur.duration);
                    }
                }
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ─── Audio Loading & Playback ──────────────────
            function loadTrack(index, autoPlay = false) {
                if (index < 0 || index >= playlist.length) {
                    audio.pause();
                    audio.src = '';
                    isPlaying = false;
                    btnPlay.innerHTML = '<i class="fas fa-play"></i>';
                    trackStatus.innerHTML = '<i class="fas fa-pause"></i>';
                    trackStatus.className = 'track-status';
                    return;
                }

                currentIndex = index;
                const item = playlist[index];
                const file = item.file;

                if (!file) {
                    showToast('File not found', 'fa-triangle-exclamation', 2000);
                    return;
                }

                // Revoke old URL to avoid memory leaks
                if (audio.src && audio.src.startsWith('blob:')) {
                    URL.revokeObjectURL(audio.src);
                }

                const url = URL.createObjectURL(file);
                audio.src = url;
                audio.load();

                const name = item.displayName || getDisplayName(file);
                currentTitle.textContent = name;
                currentArtist.textContent = item.path || 'Local file';
                artwork.className = 'artwork has-track';
                artwork.innerHTML = `<i class="fas fa-music"></i>`;
                renderPlaylist();

                if (autoPlay || isPlaying) {
                    audio.play().then(() => {
                        isPlaying = true;
                        btnPlay.innerHTML = '<i class="fas fa-pause"></i>';
                        trackStatus.innerHTML = '<i class="fas fa-play"></i>';
                        trackStatus.className = 'track-status playing';
                    }).catch(() => {
                        isPlaying = false;
                        btnPlay.innerHTML = '<i class="fas fa-play"></i>';
                        trackStatus.innerHTML = '<i class="fas fa-pause"></i>';
                        trackStatus.className = 'track-status';
                    });
                } else {
                    trackStatus.innerHTML = '<i class="fas fa-pause"></i>';
                    trackStatus.className = 'track-status';
                    btnPlay.innerHTML = '<i class="fas fa-play"></i>';
                }

                // Metadata
                audio.onloadedmetadata = () => {
                    if (audio.duration && isFinite(audio.duration)) {
                        item.duration = audio.duration;
                        totalTimeEl.textContent = formatTime(audio.duration);
                        renderPlaylist();
                    }
                };

                // Time update
                audio.ontimeupdate = () => {
                    if (audio.duration && isFinite(audio.duration)) {
                        const pct = (audio.currentTime / audio.duration) * 100;
                        progressFill.style.width = `${Math.min(pct, 100)}%`;
                        currentTimeEl.textContent = formatTime(audio.currentTime);
                        totalTimeEl.textContent = formatTime(audio.duration);
                    }
                };

                // Ended
                audio.onended = () => {
                    if (repeatMode === 'one') {
                        audio.currentTime = 0;
                        audio.play().catch(() => {});
                        return;
                    }
                    const next = getNextIndex(currentIndex);
                    if (next !== -1 && (repeatMode === 'all' || isShuffled || next !== currentIndex)) {
                        loadTrack(next, true);
                    } else {
                        isPlaying = false;
                        btnPlay.innerHTML = '<i class="fas fa-play"></i>';
                        trackStatus.innerHTML = '<i class="fas fa-pause"></i>';
                        trackStatus.className = 'track-status';
                        progressFill.style.width = '100%';
                        currentTimeEl.textContent = formatTime(audio.duration || 0);
                    }
                };

                // Error
                audio.onerror = () => {
                    showToast(`Error playing: ${name}`, 'fa-triangle-exclamation', 2500);
                    isPlaying = false;
                    btnPlay.innerHTML = '<i class="fas fa-play"></i>';
                    trackStatus.innerHTML = '<i class="fas fa-pause"></i>';
                    trackStatus.className = 'track-status';
                };
            }

            function playPause() {
                if (playlist.length === 0) {
                    showToast('No tracks in playlist', 'fa-music', 1500);
                    return;
                }

                if (currentIndex === -1) {
                    loadTrack(0, true);
                    return;
                }

                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    btnPlay.innerHTML = '<i class="fas fa-play"></i>';
                    trackStatus.innerHTML = '<i class="fas fa-pause"></i>';
                    trackStatus.className = 'track-status';
                } else {
                    audio.play().then(() => {
                        isPlaying = true;
                        btnPlay.innerHTML = '<i class="fas fa-pause"></i>';
                        trackStatus.innerHTML = '<i class="fas fa-play"></i>';
                        trackStatus.className = 'track-status playing';
                    }).catch(() => {
                        if (audio.src) {
                            audio.load();
                            audio.play().catch(() => {});
                        } else {
                            loadTrack(currentIndex, true);
                        }
                    });
                }
            }

            function nextTrack() {
                if (playlist.length === 0) return;
                const next = getNextIndex(currentIndex);
                if (next !== -1) loadTrack(next, true);
            }

            function prevTrack() {
                if (playlist.length === 0) return;
                if (audio.currentTime > 2.5) {
                    audio.currentTime = 0;
                    return;
                }
                const prev = getPrevIndex(currentIndex);
                if (prev !== -1) loadTrack(prev, true);
            }

            // ─── Add Files ──────────────────────────────────
            function addFiles(fileList) {
                let added = 0;
                const newFiles = [];
                for (const file of fileList) {
                    if (isAudioFile(file)) {
                        const path = file.webkitRelativePath || file.path || file.name;
                        const exists = playlist.some(item =>
                            item.file.name === file.name &&
                            item.file.size === file.size
                        );
                        if (!exists) {
                            const item = {
                                file: file,
                                path: path,
                                displayName: getDisplayName(file),
                                duration: null,
                            };
                            playlist.push(item);
                            newFiles.push(item);
                            added++;
                        }
                    }
                }

                if (added === 0) {
                    showToast('No audio files found', 'fa-file-audio', 1500);
                    return;
                }

                showToast(`Added ${added} track${added > 1 ? 's' : ''}`, 'fa-circle-check', 1800);

                if (playlist.length > 0 && currentIndex === -1) {
                    loadTrack(0, false);
                } else {
                    renderPlaylist();
                    if (currentIndex >= 0 && currentIndex < playlist.length) {
                        const cur = playlist[currentIndex];
                        if (cur.duration) {
                            totalTimeEl.textContent = formatTime(cur.duration);
                        }
                    }
                }
                renderPlaylist();
            }

            // ─── Clear ──────────────────────────────────────
            function clearPlaylist() {
                if (playlist.length === 0) return;
                audio.pause();
                if (audio.src && audio.src.startsWith('blob:')) {
                    URL.revokeObjectURL(audio.src);
                }
                audio.src = '';
                isPlaying = false;
                btnPlay.innerHTML = '<i class="fas fa-play"></i>';
                trackStatus.innerHTML = '<i class="fas fa-pause"></i>';
                trackStatus.className = 'track-status';
                playlist = [];
                currentIndex = -1;
                renderPlaylist();
                showToast('Playlist cleared', 'fa-trash-can', 1200);
            }

            // ─── Volume ──────────────────────────────────────
            function setVolume(val) {
                volume = Math.max(0, Math.min(1, val));
                if (isMuted) {
                    audio.volume = 0;
                    volumeFill.style.width = '0%';
                } else {
                    audio.volume = volume;
                    volumeFill.style.width = `${volume * 100}%`;
                }
                updateVolumeIcon();
            }

            function updateVolumeIcon() {
                const icon = btnMute.querySelector('i');
                if (isMuted || volume === 0) {
                    icon.className = 'fas fa-volume-xmark';
                } else if (volume < 0.4) {
                    icon.className = 'fas fa-volume-low';
                } else if (volume < 0.7) {
                    icon.className = 'fas fa-volume-off';
                } else {
                    icon.className = 'fas fa-volume-high';
                }
            }

            function toggleMute() {
                if (isMuted) {
                    isMuted = false;
                    audio.volume = volume;
                    volumeFill.style.width = `${volume * 100}%`;
                } else {
                    isMuted = true;
                    previousVolume = volume;
                    audio.volume = 0;
                    volumeFill.style.width = '0%';
                }
                updateVolumeIcon();
            }

            // ─── Event Listeners ──────────────────────────

            // Play / Pause
            btnPlay.addEventListener('click', playPause);

            // Next / Prev
            btnNext.addEventListener('click', nextTrack);
            btnPrev.addEventListener('click', prevTrack);

            // Shuffle
            btnShuffle.addEventListener('click', () => {
                isShuffled = !isShuffled;
                btnShuffle.classList.toggle('active-mode', isShuffled);
                showToast(isShuffled ? 'Shuffle On' : 'Shuffle Off', 'fa-shuffle', 1000);
            });

            // Repeat
            btnRepeat.addEventListener('click', () => {
                const modes = ['none', 'all', 'one'];
                const idx = (modes.indexOf(repeatMode) + 1) % modes.length;
                repeatMode = modes[idx];
                btnRepeat.classList.toggle('active-mode', repeatMode !== 'none');
                const labels = { none: 'Repeat Off', all: 'Repeat All', one: 'Repeat One' };
                const icons = { none: 'fa-repeat', all: 'fa-repeat', one: 'fa-repeat' };
                showToast(labels[repeatMode], icons[repeatMode], 1000);
            });

            // Volume
            volumeTrack.addEventListener('click', (e) => {
                const rect = volumeTrack.getBoundingClientRect();
                const pct = (e.clientX - rect.left) / rect.width;
                setVolume(pct);
            });

            volumeTrack.addEventListener('mousedown', (e) => {
                isDraggingVolume = true;
                const rect = volumeTrack.getBoundingClientRect();
                const pct = (e.clientX - rect.left) / rect.width;
                setVolume(pct);
            });

            document.addEventListener('mousemove', (e) => {
                if (isDraggingVolume) {
                    const rect = volumeTrack.getBoundingClientRect();
                    const pct = (e.clientX - rect.left) / rect.width;
                    setVolume(Math.max(0, Math.min(1, pct)));
                }
            });

            document.addEventListener('mouseup', () => {
                isDraggingVolume = false;
            });

            btnMute.addEventListener('click', toggleMute);

            // Progress seeking
            progressTrack.addEventListener('click', (e) => {
                if (!audio.duration || !isFinite(audio.duration)) return;
                const rect = progressTrack.getBoundingClientRect();
                const pct = (e.clientX - rect.left) / rect.width;
                audio.currentTime = pct * audio.duration;
            });

            progressTrack.addEventListener('mousedown', (e) => {
                isDraggingProgress = true;
                if (!audio.duration || !isFinite(audio.duration)) return;
                const rect = progressTrack.getBoundingClientRect();
                const pct = (e.clientX - rect.left) / rect.width;
                audio.currentTime = pct * audio.duration;
            });

            document.addEventListener('mousemove', (e) => {
                if (isDraggingProgress && audio.duration && isFinite(audio.duration)) {
                    const rect = progressTrack.getBoundingClientRect();
                    const pct = (e.clientX - rect.left) / rect.width;
                    audio.currentTime = Math.max(0, Math.min(1, pct)) * audio.duration;
                }
            });

            document.addEventListener('mouseup', () => {
                isDraggingProgress = false;
            });

            // ─── Keyboard shortcuts ──────────────────────
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    playPause();
                }
                if (e.code === 'ArrowRight') {
                    e.preventDefault();
                    if (audio.duration) audio.currentTime = Math.min(audio.currentTime + 5, audio.duration);
                }
                if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    if (audio.duration) audio.currentTime = Math.max(audio.currentTime - 5, 0);
                }
                if (e.code === 'KeyN') nextTrack();
                if (e.code === 'KeyP') prevTrack();
                if (e.code === 'KeyM') toggleMute();
            });

            // ─── File Selection ──────────────────────────

            // Folder
            btnSelectFolder.addEventListener('click', () => {
                if ('showDirectoryPicker' in window) {
                    window.showDirectoryPicker()
                        .then(async (dirHandle) => {
                            const files = [];
                            await walkDirectory(dirHandle, files);
                            if (files.length > 0) {
                                addFiles(files);
                            } else {
                                showToast('No audio files found', 'fa-folder-open', 1500);
                            }
                        })
                        .catch((err) => {
                            if (err.name !== 'AbortError' && err.name !== 'SecurityError') {
                                fileInput.click();
                            } else if (err.name === 'SecurityError') {
                                showToast('Permission denied. Use "Files" instead.', 'fa-lock', 2000);
                            }
                        });
                } else {
                    fileInput.click();
                }
            });

            async function walkDirectory(dirHandle, files, path = '') {
                for await (const entry of dirHandle.values()) {
                    if (entry.kind === 'file') {
                        const file = await entry.getFile();
                        if (isAudioFile(file)) {
                            file.path = path + entry.name;
                            files.push(file);
                        }
                    } else if (entry.kind === 'directory') {
                        await walkDirectory(entry, files, path + entry.name + '/');
                    }
                }
            }

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    addFiles(e.target.files);
                }
                fileInput.value = '';
            });

            // Files (multiple)
            btnSelectFiles.addEventListener('click', () => {
                fileInputMultiple.click();
            });

            fileInputMultiple.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    addFiles(e.target.files);
                }
                fileInputMultiple.value = '';
            });

            // Clear
            btnClear.addEventListener('click', clearPlaylist);

            // ─── Playlist Click / Remove / Drag ──────────

            playlistItemsEl.addEventListener('click', (e) => {
                const item = e.target.closest('.playlist-item');
                if (!item) return;
                const idx = parseInt(item.dataset.index);
                if (isNaN(idx)) return;

                // Remove button
                if (e.target.closest('.remove-btn')) {
                    const idx2 = parseInt(e.target.closest('.remove-btn').dataset.index);
                    if (!isNaN(idx2)) {
                        removeTrack(idx2);
                        return;
                    }
                    return;
                }

                // Load track
                if (idx >= 0 && idx < playlist.length) {
                    const wasPlaying = isPlaying;
                    loadTrack(idx, wasPlaying);
                }
            });

            function removeTrack(index) {
                if (index < 0 || index >= playlist.length) return;
                const wasCurrent = index === currentIndex;
                playlist.splice(index, 1);

                if (wasCurrent) {
                    audio.pause();
                    if (audio.src && audio.src.startsWith('blob:')) {
                        URL.revokeObjectURL(audio.src);
                    }
                    audio.src = '';
                    isPlaying = false;
                    btnPlay.innerHTML = '<i class="fas fa-play"></i>';
                    trackStatus.innerHTML = '<i class="fas fa-pause"></i>';
                    trackStatus.className = 'track-status';
                    currentIndex = -1;
                    if (playlist.length > 0) {
                        const newIdx = Math.min(index, playlist.length - 1);
                        loadTrack(newIdx, false);
                    } else {
                        renderPlaylist();
                        currentTitle.textContent = 'No track selected';
                        currentArtist.textContent = '—';
                        artwork.className = 'artwork';
                        artwork.innerHTML = '<i class="fas fa-music"></i>';
                        progressFill.style.width = '0%';
                        currentTimeEl.textContent = '0:00';
                        totalTimeEl.textContent = '0:00';
                    }
                } else if (currentIndex > index) {
                    currentIndex--;
                    renderPlaylist();
                } else {
                    renderPlaylist();
                }
                renderPlaylist();
            }

            // ─── Drag & Drop (reorder) ──────────────────

            let dragItem = null;

            playlistItemsEl.addEventListener('dragstart', (e) => {
                const item = e.target.closest('.playlist-item');
                if (!item) return;
                const idx = parseInt(item.dataset.index);
                if (isNaN(idx)) return;
                dragItem = idx;
                item.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', idx);
            });

            playlistItemsEl.addEventListener('dragend', (e) => {
                const item = e.target.closest('.playlist-item');
                if (item) item.classList.remove('dragging');
                document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('drag-over'));
                dragItem = null;
            });

            playlistItemsEl.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const target = e.target.closest('.playlist-item');
                document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('drag-over'));
                if (target) target.classList.add('drag-over');
            });

            playlistItemsEl.addEventListener('dragleave', (e) => {
                const target = e.target.closest('.playlist-item');
                if (target) target.classList.remove('drag-over');
            });

            playlistItemsEl.addEventListener('drop', (e) => {
                e.preventDefault();
                document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('drag-over'));
                const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
                const toItem = e.target.closest('.playlist-item');
                if (!toItem) return;
                const toIdx = parseInt(toItem.dataset.index);
                if (isNaN(fromIdx) || isNaN(toIdx) || fromIdx === toIdx) return;

                // Reorder
                const [moved] = playlist.splice(fromIdx, 1);
                playlist.splice(toIdx, 0, moved);

                // Update currentIndex
                if (currentIndex === fromIdx) {
                    currentIndex = toIdx;
                } else if (currentIndex > fromIdx && currentIndex <= toIdx) {
                    currentIndex--;
                } else if (currentIndex < fromIdx && currentIndex >= toIdx) {
                    currentIndex++;
                }

                renderPlaylist();
                showToast('Playlist reordered', 'fa-arrow-up-short-wide', 1200);
            });

            // ─── Drag & Drop (files onto app) ──────────

            app.addEventListener('dragover', (e) => {
                e.preventDefault();
                app.classList.add('drag-over');
            });

            app.addEventListener('dragleave', () => {
                app.classList.remove('drag-over');
            });

            app.addEventListener('drop', (e) => {
                e.preventDefault();
                app.classList.remove('drag-over');
                const items = e.dataTransfer.items;
                if (!items) return;
                const files = [];
                for (const item of items) {
                    if (item.kind === 'file') {
                        const file = item.getAsFile();
                        if (file && isAudioFile(file)) {
                            files.push(file);
                        }
                    }
                }
                if (files.length > 0) {
                    addFiles(files);
                } else {
                    showToast('No audio files dropped', 'fa-file-audio', 1500);
                }
            });

            // ─── Init ──────────────────────────────────────

            setVolume(0.80);
            audio.volume = 0.80;
            btnShuffle.classList.remove('active-mode');
            btnRepeat.classList.remove('active-mode');
            renderPlaylist();

            // Show welcome
            setTimeout(() => {
                showToast('🎵 Drop your music or click "Folder"', 'fa-headphones-simple', 2800);
            }, 400);

            // Expose for debugging
            window.__player = { playlist, audio, loadTrack, playPause, nextTrack, prevTrack, addFiles };

        })();
    </script>

</body>
</html>
